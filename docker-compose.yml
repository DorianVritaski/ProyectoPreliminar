version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gestevents_db
    restart: always
    environment:
      POSTGRES_USER: gestevents_user
      POSTGRES_PASSWORD: gestevents_pass
      POSTGRES_DB: gestevents_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestevents_user -d gestevents_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestevents_backend
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: gestevents_user
      POSTGRES_PASSWORD: gestevents_pass
      POSTGRES_DB: gestevents_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestevents_frontend
    restart: always
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
